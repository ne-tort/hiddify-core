version: '3.8'

services:
  hiddify:
    image: ghcr.io/hiddify/pathology-core:latest
    network_mode: host
    environment:
      CONFIG: "https://github.com/ne-tort/pathology-app/raw/refs/heads/main/test.configs/warp"
    volumes:
      - ./hiddify.json:/hiddify/hiddify.json
    command: ["/opt/pathology.sh"]
